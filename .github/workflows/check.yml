name: Curio checks
on:
  pull_request:
  push:
    branches: [main, codex/curio-first-release]
permissions:
  contents: read
jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check.mjs
